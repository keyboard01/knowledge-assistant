server:
  # 9090 而非 8080：本机 8080 已被另一个项目占用。
  # 改这里必须同步改 frontend/vite.config.js 的代理目标与 tools/*.ps1 里的 API 基址。
  port: 9090
  address: 127.0.0.1

spring:
  application:
    name: knowledge-assistant
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/assistant
    username: assistant
    password: ${PG_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # 浏览器上传（P1）：默认 1MB 太小，放到 50MB。这是"上传入库"的上限，
      # 与查看入口的 20MB 上限（那是"下载查看"）各自独立。
      max-file-size: 50MB
      max-request-size: 52MB
  sql:
    init:
      mode: always
      # Windows 下 JVM 默认字符集是 GBK，不显式指定会把 UTF-8 的 schema.sql 读成乱码写进库
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      continue-on-error: false

assistant:
  retrieval:
    # 查询改写（P1）：on = 用生成模型产出 2~3 条变体，与原问题并行召回后多路融合。
    # 默认 off——改写要多一次模型调用，且属于"快速通道也要更好"那类，由运维按需开启；失败一律 fail-open。
    rewrite: off
  chunking:
    # 片段预算按**估算 token**计（中文≈1 字 1 token、英文按词），不是字符数。
    # min：低于此视为“短块”，可并入同章节路径/同类型/同页的相邻块；
    # target：长段落按句打包到的软目标；max：单片段硬上限（超长单句按字符硬切）；
    # overlap：相邻片段保留的尾部重叠，防止答案卡在边界被切两半。
    min-tokens: 60
    target-tokens: 150
    max-tokens: 200
    overlap-tokens: 30

logging:
  level:
    root: INFO
    io.github.keyboard01.assistant: DEBUG
